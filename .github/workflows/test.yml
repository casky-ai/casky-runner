name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - forensics
          - malware
          - threat-intel
          - threat-hunting
          - network
          - cloud
          - web-app
          - vuln-scan
          - exploitation
          - post-exploit
          - incident-response
          - detection
          - osint
          - recon
          - identity
          - active-directory
          - appsec
          - devsecops

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runner image
        uses: docker/build-push-action@v5
        with:
          load: true
          push: false
          tags: casky-runner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull skill image
        run: |
          if docker pull ghcr.io/casky-ai/skills/${{ matrix.skill }}:latest 2>/dev/null; then
            echo "SKILL_IMAGE_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "Skill image ghcr.io/casky-ai/skills/${{ matrix.skill }}:latest not yet available — skipping verify"
            echo "SKILL_IMAGE_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Start skill container
        if: env.SKILL_IMAGE_AVAILABLE == 'true'
        run: |
          docker run -d --name skill-lab \
            ghcr.io/casky-ai/skills/${{ matrix.skill }}:latest

      - name: Run casky verify
        if: env.SKILL_IMAGE_AVAILABLE == 'true'
        run: |
          docker run --rm \
            -e SKILL_LAB_NAME=skill-lab \
            -v /var/run/docker.sock:/var/run/docker.sock \
            casky-runner:test \
            casky verify ${{ matrix.skill }}

      - name: Cleanup
        if: always()
        run: docker rm -f skill-lab 2>/dev/null || true
