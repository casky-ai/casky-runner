name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill:
          - forensics
          - malware
          - threat-intel
          - threat-hunting
          - network
          - cloud
          - web-app
          - vuln-scan
          - exploitation
          - post-exploit
          - incident-response
          - detection
          - osint
          - recon
          - identity
          - active-directory
          - appsec
          - devsecops

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Pull skill image
        run: |
          if docker pull ghcr.io/casky-ai/skills/${{ matrix.skill }}:latest 2>/dev/null; then
            echo "SKILL_IMAGE_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "Skill image not yet published — skipping"
            echo "SKILL_IMAGE_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Start skill container
        if: env.SKILL_IMAGE_AVAILABLE == 'true'
        run: |
          docker run -d --name skill-lab \
            ghcr.io/casky-ai/skills/${{ matrix.skill }}:latest \
            sleep infinity

      # Verify runs directly on the GHA host (not inside the runner container)
      # so it has native access to /var/run/docker.sock without permission issues.
      - name: Verify skill tools
        if: env.SKILL_IMAGE_AVAILABLE == 'true'
        run: |
          SKILL="${{ matrix.skill }}"
          PASS=0; FAIL=0
          while IFS= read -r tool; do
            [[ -z "$tool" || "$tool" == \#* ]] && continue
            if docker exec skill-lab which "$tool" > /dev/null 2>&1; then
              echo "  ✓ $tool"
              PASS=$((PASS + 1))
            else
              echo "  ✗ $tool — NOT FOUND"
              FAIL=$((FAIL + 1))
            fi
          done < "skills/${SKILL}.tools"
          echo ""
          if [[ $FAIL -gt 0 ]]; then
            echo "FAIL: $FAIL tool(s) missing from skill-lab"
            exit 1
          fi
          echo "PASS: all $PASS tools present in skill-lab (${SKILL})"

      - name: Cleanup
        if: always()
        run: docker rm -f skill-lab 2>/dev/null || true
