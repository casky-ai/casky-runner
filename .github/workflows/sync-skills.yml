name: Sync Upstream Skills Library

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild even if upstream version hasn't changed
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream version
        id: upstream
        run: |
          UPSTREAM_TAG=$(git ls-remote --tags https://github.com/mukul975/Anthropic-Cybersecurity-Skills | grep -oP 'v\d+\.\d+\.\d+' | sort -V | tail -1)
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_TAG="main"
          fi
          echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT

      - name: Read last sync version
        id: last_sync
        run: |
          if [ -f docker/skills/.last-sync ]; then
            LAST=$(cat docker/skills/.last-sync)
            echo "version=$LAST" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
          fi

      - name: Determine if rebuild needed
        id: rebuild
        run: |
          UPSTREAM="${{ steps.upstream.outputs.tag }}"
          LAST="${{ steps.last_sync.outputs.version }}"
          FORCE="${{ github.event.inputs.force }}"

          if [ "$FORCE" = "true" ] || [ "$UPSTREAM" != "$LAST" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Rebuild needed: upstream=$UPSTREAM, last=$LAST, force=$FORCE"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date at $LAST"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.rebuild.outputs.needed == 'true'

      - uses: docker/login-action@v3
        if: steps.rebuild.outputs.needed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        if: steps.rebuild.outputs.needed == 'true'
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        if: steps.rebuild.outputs.needed == 'true'
        with:
          context: .
          file: docker/skills/Dockerfile
          push: true
          tags: |
            ghcr.io/casky-ai/skills-library:latest
            ghcr.io/casky-ai/skills-library:${{ github.run_id }}
            ghcr.io/casky-ai/skills-library:${{ steps.date.outputs.date }}

      - name: Update .last-sync
        if: steps.rebuild.outputs.needed == 'true'
        run: |
          mkdir -p docker/skills
          echo "${{ steps.upstream.outputs.tag }}" > docker/skills/.last-sync

      - name: Commit and push
        if: steps.rebuild.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker/skills/.last-sync
          git commit -m "chore: sync upstream skills library to ${{ steps.upstream.outputs.tag }}"
          git push origin main
