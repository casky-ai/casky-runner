name: Build Skills Library

on:
  push:
    branches: [main]
    paths:
      - 'docker/skills/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/skills/Dockerfile
          push: true
          tags: |
            ghcr.io/casky-ai/skills-library:latest
            ghcr.io/casky-ai/skills-library:${{ github.run_id }}
            ghcr.io/casky-ai/skills-library:${{ steps.date.outputs.date }}

      - id: date
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
