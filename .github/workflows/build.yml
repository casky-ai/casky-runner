name: Build and push

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both components get a rolling :latest on every push to main, same as
      # runner always has — added so downstream consumers (e.g. the workshops
      # repo's casky-box/docker-compose.yml, which pulls both instead of
      # cloning/building this repo) get an equally fresh UI image, not just a
      # runner. release.yml still owns the separate, deliberately-manual
      # numbered-version path for both.
      matrix:
        include:
          - component: runner
            context: .
            dockerfile: Dockerfile
            image: ghcr.io/casky-ai/box/runner
          - component: ui
            context: ./casky-ui
            dockerfile: casky-ui/Dockerfile
            image: ghcr.io/casky-ai/box/ui
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always load into the local daemon so Trivy scans THIS build, not a
      # stale image from GHCR (which would happen on PRs before any push).
      - name: Build (load locally)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: casky-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: casky-${{ matrix.component }}:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      # Only push after a clean Trivy scan, on main.
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag casky-${{ matrix.component }}:ci ${{ matrix.image }}:latest
          docker push ${{ matrix.image }}:latest
