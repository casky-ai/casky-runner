name: Build and push

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always load into the local daemon so Trivy scans THIS build, not a
      # stale image from GHCR (which would happen on PRs before any push).
      - name: Build (load locally)
        uses: docker/build-push-action@v5
        with:
          load: true
          push: false
          tags: casky-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: casky-runner:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      # Only push after a clean Trivy scan, on main.
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag casky-runner:ci ghcr.io/casky-ai/box/runner:latest
          docker push ghcr.io/casky-ai/box/runner:latest
