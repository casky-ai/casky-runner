id: credential-dumping-investigation
name: Credential Dumping Investigation
domain: identity
mitre_techniques:
  - T1003
  - T1552
description: >
  Investigates suspected OS credential dumping and unsecured credential
  exposure — LSASS memory access, SAM/SECURITY hive reads, and credentials
  left in files, scripts, or configuration on the affected host.
steps:
  - skill_slug: mimikatz-detection
    skill_category: identity-security
    technique_id: T1003
    technique_name: OS Credential Dumping
    rationale: Evidence references LSASS access patterns consistent with
      credential dumping tooling.
    evidence_focus: LSASS process handles, unusual reads of SAM/SECURITY hives
    step_order: 1
  - skill_slug: sam-security-hive-access-review
    skill_category: identity-security
    technique_id: T1003
    technique_name: OS Credential Dumping
    rationale: Direct registry hive extraction (reg save of SAM/SECURITY/SYSTEM)
      is a common alternative to in-memory LSASS dumping and leaves distinct
      filesystem and command-line artifacts.
    evidence_focus: reg.exe save/export command lines, .hive/.dat files written
      to disk, volume shadow copy access for offline hive extraction
    step_order: 2
  - skill_slug: dpapi-credential-blob-sweep
    skill_category: identity-security
    technique_id: T1552
    technique_name: Unsecured Credentials
    rationale: Credentials left in DPAPI-protected blobs, scripts, or config
      files are frequently harvested alongside in-memory dumping and should be
      checked to scope the full credential-exposure blast radius.
    evidence_focus: DPAPI master key/credential blob access, plaintext
      credentials in scripts/config files, browser-stored credential access
    step_order: 3
evidence_gaps:
  - No EDR telemetry confirming LSASS access source process
