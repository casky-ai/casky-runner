id: devsecops-cicd-secrets-leak
name: CI/CD Secrets Leak Investigation
domain: devsecops
mitre_techniques:
  - T1552.001
  - T1195.002
description: >
  Investigates suspected credential exposure or supply-chain compromise via
  the CI/CD pipeline — secrets committed to source history, secrets exposed
  through pipeline environment variables/logs, and tampering with build
  artifacts or dependency provenance.
steps:
  - skill_slug: git-history-secret-scan
    skill_category: devsecops
    technique_id: T1552.001
    technique_name: "Unsecured Credentials: Credentials In Files"
    rationale: Secrets committed to source control history remain retrievable
      even after later removal; a full-history secret scan (trufflehog-style)
      confirms whether the implicated credential was ever committed in the clear.
    evidence_focus: Full git history secret-pattern matches, commit
      authorship/timing of the leaking commit, whether the secret was rotated
      after discovery
    step_order: 1
  - skill_slug: cicd-pipeline-env-var-exposure-audit
    skill_category: devsecops
    technique_id: T1552.001
    technique_name: "Unsecured Credentials: Credentials In Files"
    rationale: CI/CD pipeline logs and environment variable configuration
      frequently leak secrets via debug output or overly permissive job
      environment inheritance, independent of source control exposure.
    evidence_focus: Pipeline job logs with printed environment variables,
      secret-manager access scope per job, fork-PR access to protected secrets
    step_order: 2
  - skill_slug: dependency-build-provenance-check
    skill_category: devsecops
    technique_id: T1195.002
    technique_name: "Supply Chain Compromise: Compromise Software Supply Chain"
    rationale: If pipeline credentials were exposed, the actor may have used
      them to tamper with build artifacts or push a malicious dependency
      version; provenance verification confirms artifact integrity end to end.
    evidence_focus: Build artifact checksum/signature verification, dependency
      version pin diffs, publish events from unexpected CI runners or identities
    step_order: 3
evidence_gaps:
  - Build system audit logs older than 30 days were not retained
  - Unable to confirm whether the exposed credential was used before rotation
